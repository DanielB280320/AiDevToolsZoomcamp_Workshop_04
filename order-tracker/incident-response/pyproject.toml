[project]
name = "incident-response"
version = "0.1.0"
description = "Receives Grafana alerts for Order Tracker and starts Claude Code to investigate them"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
